{% extends 'base.html' %}
{% load static %}

{% block title %}GFive | Карта залов{% endblock %}

{% block content %}
<script>
    const STATIC_IMAGES = {
        pc: "{% static 'images/icons/PC.svg' %}",
        console: "{% static 'images/icons/PS.svg' %}"
    };
</script>

<section class="map-page">
    <div class="container">
        <div class="club-header">
            <h1 class="club-title">
                <i class="fas fa-map-marked-alt"></i>
                План залов
            </h1>
            <div class="controls">
                <span class="last-updated">Обновлено: <span id="lastUpdatedTime">—</span></span>
                <button class="hmbtn" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Обновить
                </button>
                <button class="hmbtn hmbtn--primary" id="autoRefreshToggle">
                    Автообновление: ВКЛ
                </button>
            </div>
        </div>

        <div id="hallsContainer"></div>

        <div class="legend">
            <div class="legend-item"><div class="legend-color available"></div> Свободно</div>
            <div class="legend-item"><div class="legend-color reserved"></div> Забронировано</div>
            <div class="legend-item"><div class="legend-color maintenance"></div> Обслуживание</div>
            <div class="legend-item"><div class="legend-color in_use"></div> Используется</div>
        </div>
    </div>
</section>

<div id="specModal" class="modal-backdrop">
    <div class="modal-card">
        <button class="close-modal-btn" id="closeModal">&times;</button>
        <div class="modal-header">
            <h2 id="modalDeviceName">Характеристики устройства</h2>
            <p id="modalDeviceLocation"></p>
        </div>
        <div class="modal-body">
            <table class="specs-table" id="specsTable">
                </table>
        </div>
        <div class="modal-footer">
            <a href="#" id="bookBtn" class="book-action-btn">Забронировать устройство</a>
        </div>
    </div>
</div>

<script src="{% static 'js/hallsMap.js' %}"></script>
{% endblock %}
