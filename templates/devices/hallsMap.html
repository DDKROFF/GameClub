{% extends 'base.html' %}
{% block title %}GFive | Карта залов{% endblock %}
{% block content %}
    {% load static %}


    <body>
    <section class="container" style="padding-top: 70px">
        <div class="club-header">
            <h1 class="club-title"><i class="fas fa-map-marked-alt" style="color: var(--gold); margin-right: 12px;"></i> План залов</h1>
            <div class="controls">
                <span class="last-updated">Обновлено: <span id="lastUpdatedTime">—</span></span>
                <button class="hmbtn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Обновить</button>
                <button class="hmbtn hmbtn--primary" id="autoRefreshToggle">Автообновление: ВКЛ</button>
            </div>
        </div>

        <div id="hallsContainer"></div>
    </section>
    <script src="{% static 'js/hallsMap.js' %}"></script>
{% endblock %}
</body>
</html>
