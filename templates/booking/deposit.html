{% extends 'base.html' %}
{% load static %}

{% block title %}Пополнение баланса - GFive Club{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title"><i class="fas fa-money-bill-wave"></i> Пополнение баланса</h2>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.amount.id_for_label }}">{{ form.amount.label }}</label>
                {{ form.amount }}
                {% if form.amount.errors %}
                    <div class="form-error">{{ form.amount.errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="auth-btn-submit">Пополнить <i class="fas fa-arrow-right"></i></button>
        </form>
        <div class="auth-footer">
            <a href="{% url 'users:profile' %}">← Вернуться в профиль</a>
        </div>
    </div>
</div>
{% endblock %}
