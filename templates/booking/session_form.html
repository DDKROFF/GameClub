<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление сеансом</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white p-5">
<div class="container" style="max-width: 600px;">

    <h2 class="mb-4">Управление устройством: {{ device.inventory_number }}</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'booking:session_form' %}">
        {% csrf_token %}

        <input type="hidden" name="device_id" value="{{ device.id }}">

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-warning w-100 fw-bold">Подтвердить действие</button>
            <a href="{% url 'hallMap' %}" class="btn btn-outline-secondary w-100">Назад к карте</a>
        </div>
    </form>

</div>
</body>
</html>
