[project]
name = "gameclub"
version = "0.1.0"
description = "Компьютерный клуб GFive"
authors = [
    {name = "DDKROFF"}
]
requires-python = "3.13.5"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "sqlparse (>=0.5.5,<0.6.0)",
    "tzdata (>=2026.2,<2027.0)",
    "faker (>=40.19.1,<41.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
